name: Update data

on:
  schedule:
    # Daily at 03:17 UTC. GitHub cron is always UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:

# A manual run and the scheduled run must not publish at the same time.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # changelog-from-git.mjs and history.mjs read the full commit history.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # The pipeline scripts use Node built-ins only; no npm install needed.
          package-manager-cache: false

      - name: Restore source snapshots
        id: snapshots
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            snapshots-

      - name: Generate changelog from git history
        run: node scripts/changelog-from-git.mjs

      - name: Fetch sources
        run: node scripts/fetch.mjs

      - name: Detect source changes
        id: check
        shell: bash
        run: |
          set +e
          node scripts/check.mjs
          code=$?
          set -e
          # 0 = unchanged, 2 = changed. Anything else is a real failure.
          node scripts/check-exit.mjs "$code"

      - name: Parse snapshots
        run: node scripts/parse-all.mjs

      - name: Build dataset
        run: node scripts/build.mjs

      - name: Record history
        run: node scripts/history.mjs

      - name: Generate landing page
        run: node scripts/landing.mjs

      - name: Generate plan and provider pages
        run: node scripts/pages.mjs

      - name: Generate sitemap and feed
        run: node scripts/seo.mjs

      # Tests read parsed/, public/sitemap.xml and the generated plan pages, so
      # they run after the full generation, not directly after fetch.
      - name: Test
        run: npm test

      - name: Mirror generated output into the root
        run: node scripts/publish.mjs mirror --version "$GITHUB_SHA"

      - name: Stage generated paths only
        run: node scripts/publish.mjs stage

      - name: Commit and push when changed
        id: commit
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): daily update $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "push failed after 3 attempts" >&2
              exit 1
            fi
            git pull --rebase origin main
          done

      - name: Open or update the manual review issue
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/review-issue.mjs --run-url "$RUN_URL"

      # Keep the snapshots even when tests or the review step fail later.
      - name: Save source snapshots
        if: always() && hashFiles('cache/manifest.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: snapshots-${{ github.run_id }}-${{ github.run_attempt }}
