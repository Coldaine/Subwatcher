    noteDe: "Offiziell: 2499 $ pro Monat ergeben ein monatliches Compute-Budget von 2849 $, abgebucht zu den Kosten, die der Anbieter pro Request meldet, also zu den veroeffentlichten Preisen pro Modell. Innerhalb des Monats gibt es keine 5-Stunden- oder Wochen-Fenster; Requests laufen mit voller Geschwindigkeit bis das Budget aufgebraucht ist und antworten dann mit 402 bis zur Erneuerung, ohne Aufpreis, ausser man schaltet Pay as you go selbst ein. Cache-Lesen wird zum veroeffentlichten Cache-Read-Preis abgerechnet. Einen Preis fuers Schreiben in den Cache veroeffentlicht der Anbieter nicht, der Build setzt dafuer den Input-Preis an; kostet ein Write real mehr als frischer Input, sind die hier gezeigten Requests pro Dollar eine Obergrenze und keine Untergrenze. Vier der 32 veroeffentlichten Modelle haben keinen Cache-Read-Preis (Qwen, als Not listed markiert), sie bekommen daher keine Zeile, der Median wird ueber 28 Modelle gebildet; Gateway-Cache-Breakpoints dokumentiert Standard Compute fuer Claude-Modelle. Scale ergaenzt dedizierten Durchsatz und Priority-Support mit direkter Leitung zu den Entwicklern. Jeder Tarif erreicht jedes Modell, die Tarife unterscheiden sich also in Budget, Parallelitaet und Scheduling, nicht im Modellzugang. Quellen: standardcompute.com/llm-api-pricing und standardcompute.com/standard-compute-facts (gelesen 2026-10-18)."
