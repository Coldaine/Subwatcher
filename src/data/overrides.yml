      - { label: "Monthly", unit: "USD usage", amount: 20, window: month, refresh: monthly, disclosure: exact }
    lastVerified: 2026-10-18
    note: "Official: $19/month buys a $20 monthly compute budget, drawn down at the cost the provider reports for each request, so the rates are the per-model ones Standard Compute publishes. There are no 5-hour or weekly windows inside the month; requests run at full speed until the budget is spent, then return 402 until renewal, with no overage unless Pay as you go is enabled. Cached input is billed at the published cached-input rate. No cache write rate is published, so the build falls back to the input rate for writes; if a write actually costs more than fresh input, the requests per dollar shown here are an upper bound rather than a floor. Four of the 32 published models have no cached input rate (Qwen, marked Not listed), so they carry no row and the median is computed over 28 models; Standard Compute documents gateway cache breakpoints for Claude models. Starter runs one agent at a time and includes one API key. Every plan reaches every model, so tiers differ in budget, parallelism and scheduling, not model access. Sources: standardcompute.com/llm-api-pricing and standardcompute.com/standard-compute-facts (read 2026-10-18)."
    noteDe: "Offiziell: 19 $ pro Monat ergeben ein monatliches Compute-Budget von 20 $, abgebucht zu den Kosten, die der Anbieter pro Request meldet, also zu den veroeffentlichten Preisen pro Modell. Innerhalb des Monats gibt es keine 5-Stunden- oder Wochen-Fenster; Requests laufen mit voller Geschwindigkeit bis das Budget aufgebraucht ist und antworten dann mit 402 bis zur Erneuerung, ohne Aufpreis, ausser man schaltet Pay as you go selbst ein. Cache-Lesen wird zum veroeffentlichten Cache-Read-Preis abgerechnet. Einen Preis fuers Schreiben in den Cache veroeffentlicht der Anbieter nicht, der Build setzt dafuer den Input-Preis an; kostet ein Write real mehr als frischer Input, sind die hier gezeigten Requests pro Dollar eine Obergrenze und keine Untergrenze. Vier der 32 veroeffentlichten Modelle haben keinen Cache-Read-Preis (Qwen, als Not listed markiert), sie bekommen daher keine Zeile, der Median wird ueber 28 Modelle gebildet; Gateway-Cache-Breakpoints dokumentiert Standard Compute fuer Claude-Modelle. Starter laeuft mit einem Agenten gleichzeitig und enthaelt einen API-Key. Jeder Tarif erreicht jedes Modell, die Tarife unterscheiden sich also in Budget, Parallelitaet und Scheduling, nicht im Modellzugang. Quellen: standardcompute.com/llm-api-pricing und standardcompute.com/standard-compute-facts (gelesen 2026-10-18)."

