  # Command Code: die Preisseite schreibt an JEDEN Planpreis eine Gebuehr fuer
  # Kartenzahlung (Satz erst im Checkout, "both shown before you continue").
  # Deshalb steht hier EIN Preis inklusive Gebuehr: GOAT ist gemessen (10,78 $
  # fuer den 10-$-Tarif am 2026-10-02 = 7,8 %), derselbe gemessene Satz liegt den
  # uebrigen Tarifen zugrunde. Keine separate Gebuehren-Marke: Listenpreis und
  # Gebuehr stehen in der billingNote, die Mechanik in Methodik-Schritt 7.
  - id: command-code-go
    price: { monthlyUsd: 1.08, paidPrice: 1.08, advertisedPrice: 1, currency: USD, billingNote: "list $1.00 + $0.08 card processing fee" }
    tag: "CLI only"
    tagDe: "nur CLI"
    note: "No API access: the $1 Go credits can only be spent in the Command Code CLI, so this plan cannot be used from your own harness or agent. Every other Command Code plan includes API access. The price includes the card processing fee (rate measured on the GOAT tier, 7.8 %)."
    noteDe: "Kein API-Zugang: Die Credits des 1-$-Plans lassen sich nur in der Command-Code-CLI ausgeben, der Plan ist damit nicht in einem eigenen Harness oder Agenten nutzbar. Alle anderen Command-Code-Plaene haben API-Zugang. Der Preis enthaelt die Gebuehr fuer Kartenzahlung (Satz am GOAT-Tarif gemessen, 7,8 %)."
