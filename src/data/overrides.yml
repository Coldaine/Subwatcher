      - { model: "GPT-6 Luna", input: 0.1, cachedRead: 0.01, output: 0.5 }
      - { model: "Claude Fable 5.1", input: 10.0, cachedRead: 0.25, output: 50.0 }
      - { model: "Claude Fable 5", input: 10.0, cachedRead: 1.0, output: 50.0 }
      - { model: "Claude Opus 5", input: 5.0, cachedRead: 0.5, output: 25.0 }
      - { model: "Claude Opus 5.5", input: 4.0, cachedRead: 0.2, output: 20.0 }
      - { model: "Claude Sonnet 5.5", input: 2.0, cachedRead: 0.1, output: 10.0 }
      - { model: "Claude Sonnet 5", input: 2.0, cachedRead: 0.2, output: 10.0 }
      - { model: "Claude Haiku 5.5", input: 0.1, cachedRead: 0.01, output: 0.5 }
      - { model: "Gemini 3.1 Pro Preview", input: 2.0, cachedRead: 0.2, output: 12.0 }
      - { model: "Gemini 3.8 Flash", input: 1.5, cachedRead: 0.15, output: 7.5 }
      - { model: "Gemini 2.5 Pro", input: 1.25, cachedRead: 0.125, output: 10.0 }
      - { model: "Gemini 3.5 Flash-Lite", input: 0.3, cachedRead: 0.03, output: 2.5 }
      - { model: "Gemini 2.5 Flash", input: 0.3, cachedRead: 0.03, output: 2.5 }
      - { model: "Kimi K3", input: 3.0, cachedRead: 0.3, output: 15.0 }
      - { model: "GLM 5.3", input: 1.4, cachedRead: 0.26, output: 4.4 }
      - { model: "GLM 5.2", input: 1.4, cachedRead: 0.26, output: 4.4 }
      - { model: "GLM 5.3 Flash", input: 0.15, cachedRead: 0.03, output: 0.5 }
      - { model: "DeepSeek V4 Pro 0813", input: 1.32, cachedRead: 0.044, output: 3.96 }
      - { model: "DeepSeek V4.1 Flash", input: 0.3, cachedRead: 0.006, output: 1.2 }
      - { model: "Mistral Large 4", input: 1.36, cachedRead: 0.14, output: 4.18 }
      - { model: "Grok 4.3", input: 1.25, cachedRead: 0.2, output: 2.5 }
      - { model: "MiniMax M3", input: 0.3, cachedRead: 0.06, output: 1.2 }
      - { model: "MiMo V2.6 Pro", input: 0.435, cachedRead: 0.0036, output: 0.87 }
      - { model: "MiMo V2.6 Flash", input: 0.14, cachedRead: 0.0028, output: 0.28 }
