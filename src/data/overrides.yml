    note: "The price is what was actually charged: $10.78 on 2026-10-02, so $0.78 card processing fee on the $10 tier. Command Code adds that fee to every plan and shows the exact rate only at checkout, so the same measured rate (7.8 %) applies to the other Command Code tiers."
    noteDe: "Der Preis ist der tatsaechlich abgebuchte Betrag: 10,78 $ am 02.10.2026, also 0,78 $ Gebuehr fuer Kartenzahlung auf den 10-$-Tarif. Command Code schlaegt diese Gebuehr auf jeden Plan und zeigt den genauen Satz erst im Checkout, deshalb liegt derselbe gemessene Satz (7,8 %) den uebrigen Command-Code-Tarifen zugrunde."
