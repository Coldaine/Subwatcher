<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vibeplan social card</title>
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../../public/fonts/SpaceGrotesk-700.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Space Grotesk"; src: url("../../public/fonts/SpaceGrotesk-500.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "Space Mono"; src: url("../../public/fonts/SpaceMono-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url("../../public/fonts/Inter-400.woff2") format("woff2"); font-weight: 400; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(120% 140% at 8% 0%, #16212d 0%, #0a0e14 55%, #080b10 100%);
    color: #e9eef5; font-family: Inter, system-ui, sans-serif;
    display: flex; align-items: center; gap: 56px; padding: 0 72px;
  }
  .mark { width: 200px; height: 200px; flex: none; filter: drop-shadow(0 24px 48px rgba(0,0,0,.55)); }
  .txt { display: flex; flex-direction: column; gap: 18px; }
  h1 { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 92px; letter-spacing: -0.03em; }
  h1 span { color: #6ee7c7; }
  .sub { font-size: 30px; color: #98a7b9; line-height: 1.35; max-width: 800px; }
  .row { display: flex; gap: 14px; margin-top: 12px; font-family: "Space Mono", monospace; font-size: 21px; }
  .pill { border: 1px solid #1f2a38; background: #101721; color: #98a7b9; border-radius: 999px; padding: 9px 18px; }
  .pill.accent { border-color: rgba(110,231,199,.45); color: #6ee7c7; background: rgba(110,231,199,.08); }
</style>
</head>
<body>
  <img class="mark" src="../../public/favicon.svg" alt="">
  <div class="txt">
    <h1>vibeplan<span>.cc</span></h1>
    <div class="sub">AI coding plans compared by tokens and requests per dollar paid.</div>
    <div class="row">
      <span class="pill accent">tokens per dollar</span>
      <span class="pill">live prices</span>
      <span class="pill">published quotas</span>
      <span class="pill">open dataset</span>
      <span class="pill">EN / DE</span>
    </div>
  </div>
</body>
</html>
